services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tastenote
      POSTGRES_PASSWORD: tastenote_local
      POSTGRES_DB: tastenote
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tastenote -d tastenote']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
